[project]
name = "reclaim"
version = "0.1.0"
description = "Reclaim: evidence-first denial recovery agent (hackathon demo, SYNTHETIC DEMO DATA only)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "pydantic==2.13.5",
    "httpx==0.28.1",
    "python-multipart",
    "python-dotenv",
    "paramiko==5.0.0",
    "reportlab==5.0.1",
    "openai==3.13.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "fhir.resources==8.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "docker: needs the docker-compose SFTP container (RECLAIM_DOCKER_TESTS=1)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reclaim"]
